name: RFQ regression
on:
  push:
    branches: [feature/rfq-quote-validation, validation/rfq-outreach-loop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check frontend/rfq.js && node --check frontend/rfq-outreach.js
      - name: Full regression suite (fake mailboxes; no production credentials)
        run: >-
          python -m pytest -n 4 -q --junitxml=rfq-test-results.xml
          --deselect tests/test_search_and_product_matching.py::TestGoogleSearchScraper::test_scrape_returns_error_without_api_key
          --deselect tests/test_search_and_product_matching.py::TestGoogleSearchScraper::test_search_by_image_url_requires_api_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfq-test-results
          path: rfq-test-results.xml
